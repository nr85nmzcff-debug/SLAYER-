<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLAYER SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090909;
  --panel: #141414;
  --red: #a63d3d;
  --text: #f2eeee;
  --muted: #858080;
  --line: #302727;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Montserrat, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body.locked { overflow: hidden; }
button { font: inherit; cursor: pointer; }

/* 3D Geometric Shapes Animation (ДОБАВЛЕНО) */
.geo-container {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  overflow: hidden;
  z-index: 0;
  perspective: 1000px;
  pointer-events: none;
}
.geo-shape {
  position: absolute;
  border: 1px solid rgba(166, 61, 61, 0.15);
  width: 150px; height: 150px;
  animation: spin 10s infinite linear;
}
.shape1 { top: 15%; left: 5%; animation-duration: 15s; }
.shape2 { bottom: 15%; right: 5%; animation-duration: 20s; border-radius: 50%; }
.shape3 { top: 65%; left: 85%; width: 80px; height: 80px; animation-duration: 8s; border-radius: 50%; }
.shape4 { top: 40%; left: 45%; width: 200px; height: 200px; animation-duration: 25s; border-radius: 50%; opacity: 0.5; }
@keyframes spin {
  0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
  100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: radial-gradient(ellipse at center, #211010 0%, #090909 65%);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.intro-content { max-width: 500px; position: relative; z-index: 2; }
.intro-logo {
  font-size: clamp(60px, 15vw, 110px);
  font-weight: 900;
  letter-spacing: -8px;
  margin: 0;
  text-shadow: 0 0 35px #8d252555;
}
.intro-sub {
  color: var(--muted);
  letter-spacing: 5px;
  font-size: 11px;
  margin: 12px 0 45px;
}
.intro-tag {
  color: var(--red);
  letter-spacing: 4px;
  font-size: 10px;
  margin-bottom: 25px;
}
.main-button {
  border: 1px solid var(--red);
  background: transparent;
  color: white;
  padding: 16px 48px;
  letter-spacing: 5px;
  transition: .25s;
}
.main-button:hover {
  background: var(--red);
  box-shadow: 0 0 30px #a63d3d55;
}
header {
  padding: 22px 7%;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 10;
  background: rgba(9,9,9,0.8);
}
.logo { font-weight: 900; letter-spacing: 3px; }
.header-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 3px;
}
main {
  width: min(1000px, 90%);
  margin: auto;
  padding: 65px 0;
  position: relative;
  z-index: 10;
}
.hero { margin-bottom: 50px; }
.hero h1 {
  font-size: clamp(35px, 8vw, 70px);
  line-height: 1;
  margin: 0 0 15px;
  font-weight: 900;
}
.hero p {
  color: var(--muted);
  letter-spacing: 3px;
  font-size: 10px;
}
.section-label {
  color: var(--red);
  letter-spacing: 4px;
  font-size: 10px;
  margin: 45px 0 18px;
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.category {
  min-height: 110px;
  background: linear-gradient(135deg, #191515, #101010);
  border: 1px solid var(--line);
  color: white;
  text-align: left;
  padding: 23px;
  transition: .25s;
}
.category:hover {
  border-color: var(--red);
  transform: translateY(-3px);
}
.category small {
  display: block;
  color: var(--red);
  letter-spacing: 3px;
  font-size: 9px;
  margin-bottom: 12px;
}
.category strong {
  font-size: 15px;
  letter-spacing: 2px;
}
#catalog-view, #detail-view { display: none; }
.view-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 30px;
}
.view-top h2 { font-size: 24px; }
.back-button {
  border: 1px solid var(--line);
  color: white;
  background: transparent;
  padding: 12px 17px;
  font-size: 10px;
  letter-spacing: 2px;
}
.back-button:hover { border-color: var(--red); }
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.product {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px;
  cursor: pointer;
  transition: .2s;
}
.product:hover { border-color: var(--red); }
.product-image {
  height: 145px;
  background: linear-gradient(145deg, #251818, #101010);
  display: grid;
  place-items: center;
  color: #684040;
  font-size: 30px;
  margin-bottom: 15px;
  overflow: hidden;
}
.product-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.product h3 { font-size: 13px; margin: 0 0 7px; text-transform: uppercase; }
.product p { color: var(--muted); font-size: 10px; }
.product-link {
  color: var(--red);
  font-size: 9px;
  letter-spacing: 2px;
}
.detail-card {
  border: 1px solid var(--line);
  background: var(--panel);
  padding: 20px;
}
.detail-image {
  height: 240px;
  background: linear-gradient(145deg, #281818, #101010);
  display: grid;
  place-items: center;
  color: #684040;
  font-size: 45px;
  margin-bottom: 25px;
  overflow: hidden;
}
.detail-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-card h2 { font-size: 25px; text-transform: uppercase; }
.detail-description {
  color: var(--muted);
  line-height: 1.8;
  font-size: 12px;
}
.specs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 25px;
}
.spec {
  padding: 14px;
  background: #0d0d0d;
  border: 1px solid var(--line);
}
.spec small {
  display: block;
  color: var(--red);
  font-size: 9px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.spec span { font-size: 11px; }
.network {
  margin-top: 90px;
  padding: 35px 15px;
  text-align: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.network-title {
  font-size: 11px;
  letter-spacing: 5px;
  color: var(--red);
}
.orb {
  width: 110px;
  height: 110px;
  margin: 28px auto;
  border-radius: 50%;
  border: 1px solid #873333;
  box-shadow: 0 0 35px #a63d3d44, inset 0 0 30px #a63d3d33;
  position: relative;
  animation: pulse 3s ease-in-out infinite;
}
.orb::before, .orb::after {
  content: "";
  position: absolute;
  inset: 12px -10px;
  border: 1px solid #753333;
  border-radius: 50%;
  transform: rotate(35deg);
}
.orb::after { transform: rotate(-35deg); }
@keyframes pulse {
  0%, 100% { transform: scale(.94); }
  50% { transform: scale(1.08); }
}
.wave {
  height: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.wave i {
  display: block;
  width: 3px;
  height: 8px;
  background: var(--red);
  animation: wave .8s ease-in-out infinite alternate;
}
.wave i:nth-child(3n) { animation-delay: .2s; }
.wave i:nth-child(2n) { animation-delay: .4s; }
@keyframes wave {
  to { height: 30px; opacity: .4; }
}
.status {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 4px;
  line-height: 2.5;
}
.music-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}
.music-controls button {
  color: white;
  background: transparent;
  border: 1px solid var(--line);
  padding: 10px 15px;
  font-size: 9px;
  letter-spacing: 2px;
}
.music-controls button:hover { border-color: var(--red); }
footer {
  padding: 35px 10px;
  text-align: center;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 3px;
  position: relative;
  z-index: 10;
}
@media (max-width: 520px) {
  .category-grid, .product-grid { grid-template-columns: 1fr; }
  main { padding-top: 45px; }
  .detail-image { height: 190px; }
}
</style>
</head>

    document.getElementById("catalog-title").textContent = "STEROID";
    branches.style.display = "grid";
    grid.style.display = "none";
    return;
  }

  branches.style.display = "none";
  grid.style.display = "grid";
  document.getElementById("catalog-title").textContent = 
    category === "1" ? "LAB REAGENT" : 
    category === "2" ? "DRUG" : 
    category === "3" ? "PEPTIDE" : 
    category === "5" ? "OTHER" : "CATEGORY " + category;
  renderProducts(catalog[category] || []);
}

function openBranch(branch) {
  currentCategory = branch;
  document.getElementById("catalog-title").textContent =
    branch === "left" ? "ПЕРОРАЛЬНАЯ ФОРМА" : "ИНЪЕКЦИОННАЯ ФОРМА";
  document.getElementById("branch-buttons").style.display = "none";
  document.getElementById("product-grid").style.display = "grid";
  renderProducts(catalog[branch] || []);
}

function renderProducts(items) {
  currentItems = items;
  const grid = document.getElementById("product-grid");
  grid.innerHTML = "";

  items.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "product";

    const image = document.createElement("div");
    image.className = "product-image";

    if (item.image) {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.title;
      image.appendChild(img);
    } else {
      image.textContent = "✦";
    }

    const title = document.createElement("h3");
    title.textContent = item.title;

    const subtitle = document.createElement("p");
    subtitle.textContent = item.subtitle + " | " + item.description;

    const link = document.createElement("div");
    link.className = "product-link";
    link.textContent = "VIEW DETAILS →";

    card.append(image, title, subtitle, link);
    card.addEventListener("click", () => openDetails(index));
    grid.appendChild(card);
  });
}

function openDetails(index) {
  const item = currentItems[index];
  if (!item) return;

  document.getElementById("detail-title").textContent = item.title;
  document.getElementById("detail-description").textContent = "Объем: " + item.subtitle + " | Цена: " + item.description;

  const image = document.getElementById("detail-image");
  image.innerHTML = "";

  if (item.image) {
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.title;
    image.appendChild(img);
  } else {
    image.textContent = "✦";
  }

  const specs = document.getElementById("detail-specs");
  specs.innerHTML = "";

  item.specs.forEach((value, index) => {
    const block = document.createElement("div");
    block.className = "spec";

    const label = document.createElement("small");
    label.textContent = index === 0 ? "ОБЪЕМ" : index === 1 ? "ЦЕНА" : "PARAMETER " + (index + 1);

    const text = document.createElement("span");
    text.textContent = value;

    block.append(label, text);
    specs.appendChild(block);
  });

  showView("detail-view");
}

function closeDetails() {
  showView("catalog-view");
}

function showCategories() {
  showView("home-view");
}

const music = document.getElementById("slayerMusic");

function startMusic() {
  music.play().then(() => {
    document.getElementById("play-button").textContent = "PAUSE MUSIC";
  }).catch(() => {
    document.getElementById("play-button").textContent = "PLAY MUSIC";
  });
}

function toggleMusic() {
  if (music.paused) {
    startMusic();
  } else {
    music.pause();
    document.getElementById("play-button").textContent = "PLAY MUSIC";
  }
}

function toggleMute() {
  music.muted = !music.muted;
  document.getElementById("mute-button").textContent =
    music.muted ? "UNMUTE" : "MUTE";
}
</script>
</body>
</html>
