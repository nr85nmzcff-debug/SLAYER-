<!DOCTYPE html>

<head>

    <style>
        :root {
            --bg: #050505;
            --accent: #a63d3d;
            --text: #ffffff;
            --text-muted: #888888;
            --card-bg: #111111;
            --border: #222222;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- SCREEN 1: SPLASH --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .splash-title { font-size: 64px; font-weight: 800; letter-spacing: 4px; color: var(--text); margin-bottom: 10px; z-index: 2; }
        .splash-sub { font-size: 14px; letter-spacing: 8px; color: var(--accent); text-transform: uppercase; margin-bottom: 50px; z-index: 2; }

        .btn-shop {
            background: transparent; border: 2px solid var(--accent); color: var(--text);
            padding: 15px 40px; font-size: 18px; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; z-index: 2; transition: 0.3s; font-family: inherit;
        }
        .btn-shop:hover { background: var(--accent); box-shadow: 0 0 20px var(--accent); }

        /* 3D Geometric Shapes */
        .geo-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; perspective: 1000px; }
        .geo-shape { position: absolute; border: 1px solid rgba(166, 61, 61, 0.3); width: 150px; height: 150px; animation: spin 10s infinite linear; }
        .shape1 { top: 20%; left: 10%; animation-duration: 15s; }
        .shape2 { bottom: 20%; right: 10%; animation-duration: 20s; border-radius: 50%; }
        .shape3 { top: 60%; left: 80%; width: 80px; height: 80px; animation-duration: 8s; }
        @keyframes spin { 0% { transform: rotateX(0) rotateY(0) rotateZ(0); } 100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); } }

        /* System Text & Wave */
        .sys-text { position: absolute; font-size: 10px; color: var(--accent); font-family: monospace; opacity: 0.5; letter-spacing: 2px; }
        .sys-1 { top: 10%; right: 10%; }
        .sys-2 { bottom: 10%; left: 10%; }

        .sound-wave { position: absolute; bottom: 15%; display: flex; gap: 4px; height: 30px; align-items: center; z-index: 2; }
        .bar { width: 3px; background: var(--accent); animation: wave 1s infinite ease-in-out alternate; }
        .bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 25px; animation-delay: 0.2s; }
        .bar:nth-child(3) { height: 15px; animation-delay: 0.3s; }
        .bar:nth-child(4) { height: 30px; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 12px; animation-delay: 0.5s; }
        @keyframes wave { 0% { transform: scaleY(0.5); } 100% { transform: scaleY(1.2); } }

        /* --- SCREEN 2: MAIN SHOP --- */
        #shop { display: none; opacity: 0; transition: opacity 0.5s; padding-bottom: 80px; }

        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); position: sticky; top: 0;
            background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(10px); z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
        .socials a { color: var(--text-muted); text-decoration: none; margin-left: 15px; font-size: 12px; transition: 0.3s; }
        .socials a:hover { color: var(--accent); }

        .music-player {
            background: var(--card-bg); padding: 10px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border); font-size: 12px;
        }
        .track-name { color: var(--text-muted); font-weight: 600; letter-spacing: 1px; }
        .controls { display: flex; gap: 15px; }
        .controls button { background: none; border: none; color: var(--text); cursor: pointer; font-size: 16px; transition: 0.3s; }
        .controls button:hover { color: var(--accent); }

        .categories-nav { display: flex; overflow-x: auto; padding: 15px 20px; gap: 10px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .categories-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted);
            padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
            white-space: nowrap; cursor: pointer; transition: 0.3s; font-family: inherit;
        }
        .cat-btn.active { border-color: var(--accent); color: var(--text); background: rgba(166, 61, 61, 0.1); }

        .sub-categories { display: none; padding: 10px 20px; gap: 10px; background: #0a0a0a; }
        .sub-categories.active { display: flex; }
        .sub-btn { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }
        .sub-btn.active { color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); padding: 20px 40px; } .categories-nav { padding: 15px 40px; } }

        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }

        .card-img { width: 100%; aspect-ratio: 1; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 10px; position: relative; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }

        .card-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; text-transform: uppercase; }
        
        .card-meta { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
        .card-size { font-size: 10px; color: var(--text-muted); }
        .card-price { font-size: 12px; color: var(--accent); font-weight: 800; }

        /* --- SCREEN 3: PRODUCT PAGE --- */
        #product-page { display: none; background: var(--bg); min-height: 100vh; padding: 20px; }
        .back-btn { background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; font-family: inherit; }
        .back-btn:hover { color: var(--text); }

        .product-detail { max-width: 800px; margin: 0 auto; }
        .detail-img { width: 100%; max-height: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--border); margin-bottom: 20px; overflow: hidden; }
        .detail-img img { width: 100%; height: 100%; object-fit: contain; }
        
        .detail-title { font-size: 24px; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; }
        .detail-info { font-size: 16px; color: var(--text); line-height: 1.6; margin-bottom: 20px; }
        .detail-info span { color: var(--accent); font-weight: 600; }
        
        .detail-btn {
            display: block; width: 100%; text-align: center; background: var(--accent);
            color: white; text-decoration: none; padding: 15px; font-weight: 800; 
            letter-spacing: 1px; font-size: 14px; border-radius: 4px;
        }
    </style>
</head>

            }, 800);

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'steroid') {
                steroidSubs.classList.add('active');
                document.querySelectorAll('.sub-btn')[0].classList.add('active');
                document.querySelectorAll('.sub-btn')[1].classList.remove('active');
                renderCatalog('steroidOral');
            } else {
                steroidSubs.classList.remove('active');
                renderCatalog(cat);
            }

        function filterSteroid(subCat, btn) {
            document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCatalog(subCat === 'oral' ? 'steroidOral' : 'steroidInject');

        function renderCatalog(categoryKey) {
            catalog.innerHTML = '';
            const filtered = products.filter(p => p.category === categoryKey);

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProduct(p.id);

                const imgContent = p.img ? `<img src="${p.img}" alt="${p.title}">` : 'NO IMAGE';

                    <div class="card-content">
                        <div class="card-title">${p.title}</div>
                        <div class="card-meta">

                            <span class="card-price">${p.price}</span>
                        </div>
                    </div>
                `;
                catalog.appendChild(card);
            });
        }

            const product = products.find(p => p.id === id);
            if (!product) return;

            const imgContainer = document.getElementById('detail-img');

            document.getElementById('detail-title').innerText = product.title;

                Объём: <span>${product.size}</span><br><br>
                Цена: <span>${product.price}</span>
            `;

            productPage.style.display = 'block';

        const playBtn = document.getElementById('play-btn');
        let isPlaying = false;

        function updatePlayState(state) {
            isPlaying = state;
            playBtn.innerText = isPlaying ? '⏸' : '▶';
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                updatePlayState(false);
            } else {
                audio.play().then(() => {
                    updatePlayState(true);
                }).catch(e => console.log(e));
            }
        }

        function toggleMute() {
            audio.muted = !audio.muted;
            document.getElementById('mute-btn').innerText = audio.muted ? '🔇' : '🔊';
        }

        function replayTrack() {
            audio.currentTime = 0;
            if (!isPlaying) togglePlay();
        }
        
        audio.onended = function() {
            updatePlayState(false);
        }
    </script>
</body>
</html>
