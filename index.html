
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLAYER SHOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#0b0b0d;
 color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:35px 20px;
 text-align:center;
 background:#111114;
 border-bottom:1px solid #29292e;
}
.logo{
 font-size:38px;
 font-weight:900;
 letter-spacing:7px;
}
.subtitle{
 font-size:15px;
 letter-spacing:9px;
 color:#999;
 margin-top:9px;
}
main{
 padding:20px;
 max-width:900px;
 margin:auto;
}
h2{
 font-size:20px;
 margin:28px 0 15px;
}
.categories{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.category{
 background:#1a1a1f;
 border:1px solid #303036;
 border-radius:13px;
 padding:22px 15px;
 font-size:15px;
 font-weight:bold;
 text-align:center;
}
.products{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}
.product{
 background:#1a1a1f;
 border-radius:14px;
 overflow:hidden;
 border:1px solid #303036;
}
.product img{
 width:100%;
 height:145px;
 object-fit:cover;
 background:#303036;
}
.product-info{padding:13px}
.product-name{
 font-weight:bold;
 font-size:15px;
}
.description{
 font-size:12px;
 color:#aaa;
 margin-top:8px;
}
.contact{
 display:block;
 text-align:center;
 margin-top:30px;
 padding:17px;
 background:#fff;
 color:#111;
 text-decoration:none;
 border-radius:12px;
 font-weight:bold;
 letter-spacing:1px;
}
footer{
 text-align:center;
 color:#777;
 padding:30px;
 font-size:12px;
}
@media(max-width:420px){
 main{padding:14px}
}
</style>
</head>

<body>

<header>
 <div class="logo">SLAYER</div>
 <div class="subtitle">S H O P</div>
</header>

<main>

<h2>КАТЕГОРИИ</h2>

<div class="categories">
 <div class="category">КАТЕГОРИЯ 01</div>
 <div class="category">КАТЕГОРИЯ 02</div>
 <div class="category">КАТЕГОРИЯ 03</div>
 <div class="category">КАТЕГОРИЯ 04</div>
</div>

<h2>КАТАЛОГ</h2>

<div class="products">

 <div class="product">
  <img src="https://placehold.co/400x250/303036/ffffff?text=PRODUCT+01" alt="Товар 01">
  <div class="product-info">
   <div class="product-name">ТОВАР 01</div>
   <div class="description">Описание товара</div>
  </div>
 </div>

 <div class="product">
  <img src="https://placehold.co/400x250/303036/ffffff?text=PRODUCT+02" alt="Товар 02">
  <div class="product-info">
   <div class="product-name">ТОВАР 02</div>
   <div class="description">Описание товара</div>
  </div>
 </div>

</div>

<a class="contact" href="https://t.me/sorrowmachine">
 СВЯЗАТЬСЯ С МЕНЕДЖЕРОМ
</a>

</main>

<footer>
 SLAYER SHOP © 2026
</footer>

</body>
</html>
